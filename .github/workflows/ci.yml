name: CI - API 自动化测试 + Allure 报告 + 禅道同步

on:
  push:
    branches: [ main, master, wenrui ]
  pull_request:
    branches: [ main, master, wenrui ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: web
        ports:
          - 3309:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17（后端构建）
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 编译后端
        run: |
          cd back
          mvn package -DskipTests -q
          echo "后端构建完成"

      - name: 启动后端
        run: |
          cd back/target
          nohup java -jar *.jar > /tmp/backend.log 2>&1 &
          echo "等待后端启动..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "后端已就绪"
              break
            fi
            sleep 2
          done

      - name: 安装 uv 和依赖
        run: |
          pip install uv
          cd api_testcases
          uv pip install -r requirements.txt --system
          uv run --system pip install allure-commandline
          uv --version

      - name: 运行 pytest + Allure
        run: |
          cd api_testcases
          uv run --system pytest --alluredir=reports/allure_results -v

      - name: 生成 Allure 报告
        run: |
          cd api_testcases
          allure generate reports/allure_results -o reports/allure_report --clean
          echo "报告路径: reports/allure_report/index.html"

      - name: 同步结果到禅道
        env:
          ZENTAO_PASS: ${{ secrets.ZENTAO_PASS }}
        run: |
          cd api_testcases
          uv run --system python zentao_sync.py

      - name: 上传 Allure 报告
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: api_testcases/reports/allure_report/
          retention-days: 30

      - name: 上传 Allure 原始结果
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: api_testcases/reports/allure_results/
          retention-days: 30
