name: CI - API 自动化测试 + Allure 报告 + 禅道同步

on:
  push:
    branches: [ main, master, wenrui ]
  pull_request:
    branches: [ main, master, wenrui ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: web
        ports:
          - 3309:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17（后端构建）
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 编译后端
        run: |
          cd back
          mvn package -DskipTests -q -B
          echo "=== 检查 JAR 文件 ==="
          ls -la target/*.jar
          echo "后端构建完成"

      - name: 初始化数据库（建表 + 种子数据）
        run: |
          # 安装 MySQL 客户端
          sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client
          # 等待 MySQL 就绪（必须用 127.0.0.1 强制 TCP，localhost 走 socket）
          echo "等待 MySQL 就绪..."
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3309 -u root -p123456 2>/dev/null; then
              echo "MySQL 已就绪（第 ${i} 次）"
              break
            fi
            sleep 2
          done
          # 执行建表脚本
          for f in back/sql/schema_v*.sql; do
            echo "执行: $f"
            mysql -h 127.0.0.1 -P 3309 -u root -p123456 web < "$f"
          done
          # 执行种子数据
          for f in back/sql/seed_*.sql; do
            echo "执行: $f"
            mysql -h 127.0.0.1 -P 3309 -u root -p123456 web < "$f"
          done
          echo "数据库初始化完成"

      - name: 启动后端
        run: |
          # 检查 JAR 是否存在
          JAR_FILE=$(ls back/target/*.jar 2>/dev/null | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "JAR 文件不存在，构建可能失败"
            ls -la back/target/ 2>/dev/null || echo "target 目录为空"
            exit 1
          fi
          echo "找到 JAR: $JAR_FILE"
          nohup java -jar "$JAR_FILE" --server.port=8080 > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          echo "后端 PID: $BACKEND_PID"
          echo "等待后端启动..."
          for i in $(seq 1 60); do
            if curl -s http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "后端已就绪（耗时 ${i}秒）"
              break
            fi
            sleep 2
            if [ $i -eq 60 ]; then
              echo "===== 后端启动超时，查看日志 ====="
              tail -50 /tmp/backend.log
              exit 1
            fi
          done

      - name: 安装 Python 依赖 + Playwright
        run: |
          cd api_testcases
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: 安装 Allure CLI
        run: |
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.33.0/allure-2.33.0.tgz | tar xz -C /tmp
          sudo ln -sf /tmp/allure-2.33.0/bin/allure /usr/local/bin/allure
          allure --version

      - name: 运行 pytest + Allure
        run: |
          cd api_testcases
          python -m pytest --alluredir=reports/allure_results -v

      - name: 生成 Allure 报告
        run: |
          cd api_testcases
          allure generate reports/allure_results -o reports/allure_report --clean
          echo "报告路径: reports/allure_report/index.html"

      - name: 同步结果到禅道
        env:
          ZENTAO_PASS: ${{ secrets.ZENTAO_PASS }}
        run: |
          cd api_testcases
          python zentao_sync.py

      - name: 上传 Allure 报告
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: api_testcases/reports/allure_report/
          retention-days: 30

      - name: 上传 Allure 原始结果
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: api_testcases/reports/allure_results/
          retention-days: 30

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/wenrui'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 下载 Allure 报告
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: _site

      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
